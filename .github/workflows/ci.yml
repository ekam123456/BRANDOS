name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - ekam123456-marketing-site

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: brandos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d brandos_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/brandos_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/brandos_test
      TEST_DATABASE_URL: postgresql://brandos_test:brandos_test@localhost:5432/brandos_test
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npm run db:generate
      - run: npm run db:deploy
      - name: Create non-bypass-RLS test role
        env:
          PGPASSWORD: postgres
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE brandos_test LOGIN PASSWORD 'brandos_test' NOSUPERUSER NOBYPASSRLS;"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "GRANT CONNECT ON DATABASE brandos_test TO brandos_test; GRANT USAGE ON SCHEMA public TO brandos_test; GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO brandos_test; GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO brandos_test;"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - name: Dependency audit
        continue-on-error: true
        run: npm audit --audit-level=high
      - run: npm run build
      - run: git diff --check
